<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>拼豆图纸生成器 · 24×24 算法自由版</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --card-bg: #ffffff;
      --text: #3a3335;
      --text-secondary: #6b5f62;
      --border: #e2dbd2;
      --accent: #d4893f;
      --accent-hover: #c07832;
      --shadow: 0 2px 16px rgba(60, 40, 20, 0.06);
      --radius: 18px;
      --radius-sm: 12px;
      --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: var(--font);
      background: var(--bg);
      background-image: radial-gradient(ellipse at 15% 15%, #fdf5ec 0%, transparent 55%),
                        radial-gradient(ellipse at 85% 80%, #f3f0eb 0%, transparent 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px;
    }
    .container { width: 100%; max-width: 980px; display: flex; flex-direction: column; gap: 18px; }
    .header { text-align: center; }
    .header .logo { font-size: 1.6rem; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .header .subtitle { font-size: 0.9rem; color: var(--text-secondary); }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 26px 28px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .upload-zone {
      border: 2.5px dashed #d5cbbf;
      border-radius: var(--radius-sm);
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      background: #fafaf7;
      transition: 0.2s;
    }
    .upload-zone:hover { border-color: var(--accent); background: #fefaf5; }
    .upload-zone input[type="file"] { display: none; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px;
      font-size: 0.88rem; font-weight: 600; border-radius: 24px; border: none;
      cursor: pointer; background: white; color: var(--text); border: 1.5px solid var(--border);
      transition: 0.2s; font-family: var(--font);
    }
    .btn-primary { background: var(--accent); color: white; border: none; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-outline:hover { background: #f5f2ed; }
    .btn-sm { padding: 6px 14px; font-size: 0.78rem; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
    .result-area { display: none; flex-direction: column; gap: 18px; }
    .result-area.active { display: flex; }
    .result-layout { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start; justify-content: center; }
    .canvas-wrapper {
      background: white; border-radius: var(--radius-sm); padding: 16px;
      box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    canvas#pixelCanvas {
      display: block; border-radius: 4px; image-rendering: pixelated; image-rendering: crisp-edges;
      cursor: crosshair;
    }
    .info-panel { flex: 1; min-width: 260px; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
    .palette-table { width: 100%; border-collapse: collapse; font-size: 0.7rem; }
    .palette-table th { font-weight: 700; color: #8c7e72; padding: 6px 2px; border-bottom: 1px solid #e8e0d6; }
    .palette-table .row-label { font-weight: 600; color: #9a8c80; }
    .palette-table .swatch {
      display: inline-block; width: 22px; height: 22px; border-radius: 5px;
      border: 1px solid rgba(0,0,0,0.1); vertical-align: middle;
    }
    .palette-table .color-num { font-weight: 700; font-size: 0.66rem; }
    .color-count-badge {
      font-size: 0.6rem; background: #d4893f; color: white; border-radius: 10px; padding: 1px 6px;
    }
    .color-count-badge.zero { background: #ccc; }
    .tooltip {
      position: fixed; background: #3a3335; color: white; padding: 6px 14px;
      border-radius: 20px; font-size: 0.75rem; pointer-events: none; opacity: 0; z-index: 100;
    }
    .tooltip.visible { opacity: 1; }
    .crop-card { display: none; }
    .crop-card.active { display: block; }
    .crop-container { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .crop-canvas-wrapper { position: relative; border-radius: 8px; overflow: hidden; touch-action: none; }
    .crop-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    select.btn {
      padding: 6px 14px; font-size: 0.78rem; border-radius: 20px; background: white;
      border: 1.5px solid var(--border); cursor: pointer; font-weight: 600;
    }
    @media (max-width: 700px) {
      .result-layout { flex-direction: column; align-items: center; }
      .info-panel { max-width: 100%; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo"><span>🧩</span> 拼豆图纸生成器</div>
    <div class="subtitle">上传图片 · 自由裁剪 · 四种算法 · 44色专业调色板</div>
  </div>

  <!-- 上传卡片 -->
  <div class="card" id="uploadCard">
    <div class="upload-zone" id="uploadZone">
      <span style="font-size:2.5rem;">🖼️</span>
      <p><strong>点击上传或拖拽图片</strong></p>
      <p style="font-size:0.8rem;">支持 JPG/PNG/WebP · Ctrl+V 粘贴</p>
      <input type="file" id="fileInput" accept="image/*">
    </div>
  </div>

  <!-- 裁剪卡片 -->
  <div class="card crop-card" id="cropCard">
    <div class="crop-container">
      <h3 style="font-size:0.95rem;">✂️ 拖动选择框，框选正方形区域</h3>
      <div class="crop-canvas-wrapper" id="cropCanvasWrapper">
        <canvas id="cropCanvas"></canvas>
      </div>
      <div class="crop-controls">
        <label>框大小：</label>
        <input type="range" id="cropSizeSlider" min="15" max="100" value="85" step="1" style="width:150px;">
        <span id="sizeIndicator" style="font-weight:700;">85%</span>
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" id="btnConfirmCrop">✅ 确认裁剪</button>
        <button class="btn" id="btnCancelCrop">↩ 重新上传</button>
      </div>
    </div>
  </div>

  <!-- 结果区域 -->
  <div class="result-area" id="resultArea">
    <div class="btn-group">
      <button class="btn btn-primary" id="btnDownload">📥 下载图纸</button>
      <button class="btn btn-outline btn-sm" id="btnToggleNumbers">🔢 编号</button>
      <button class="btn btn-outline btn-sm" id="btnToggleGrid">📐 网格</button>
      <button class="btn btn-outline btn-sm" id="btnReset">🔄 重新上传</button>
      <div style="display:flex; align-items:center; gap:6px; margin-left:8px;">
        <label for="algorithmSelect" style="font-size:0.8rem; font-weight:600;">算法：</label>
        <select id="algorithmSelect" class="btn btn-sm" style="padding:6px 10px;">
          <option value="bilinear">双线性 (平滑)</option>
          <option value="nearest">最邻近 (硬边)</option>
          <option value="average">均值 (平均色)</option>
          <option value="gaussian">高斯 (模糊)</option>
        </select>
      </div>
    </div>
    <div class="result-layout">
      <div class="canvas-wrapper">
        <div style="font-weight:700; margin-bottom:8px;">📋 24×24 像素图纸</div>
        <canvas id="pixelCanvas"></canvas>
      </div>
      <div class="info-panel">
        <div class="card" style="padding:16px;">
          <h3 style="margin-bottom:12px;">🎨 调色板 · 颜色对照</h3>
          <div id="palette1Container" style="margin-bottom:10px;"></div>
          <div id="palette2Container"></div>
          <div id="totalBeads" style="margin-top:12px; font-weight:600; text-align:center;"></div>
        </div>
        <div class="card" style="padding:14px; font-size:0.8rem;">
          <strong>💡 提示：</strong>悬停网格看颜色，悬停色块高亮对应格子，下载图纸可打印。
        </div>
      </div>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>
<canvas id="downloadCanvas" style="display:none;"></canvas>

<script>
  (function() {
    // ---------- 调色板 ----------
    const BEAD_PALETTE = [
      {name:'炭黑色',hex:'#262626',rgb:[38,38,38],palette:1,row:1,rowLabel:'黑白中性灰'},
      {name:'中灰色',hex:'#B2B2B2',rgb:[178,178,178],palette:1,row:1,rowLabel:'黑白中性灰'},
      {name:'米白浅灰',hex:'#E6E2DD',rgb:[230,226,221],palette:1,row:1,rowLabel:'黑白中性灰'},
      {name:'纯白色',hex:'#FFFFFF',rgb:[255,255,255],palette:1,row:1,rowLabel:'黑白中性灰'},
      {name:'砖红色',hex:'#D13A3A',rgb:[209,58,58],palette:1,row:2,rowLabel:'红色系'},
      {name:'酒红/枣红',hex:'#9E1818',rgb:[158,24,24],palette:1,row:2,rowLabel:'红色系'},
      {name:'玫红色',hex:'#D61F58',rgb:[214,31,88],palette:1,row:2,rowLabel:'红色系'},
      {name:'裸粉豆沙',hex:'#E6A89A',rgb:[230,168,154],palette:1,row:2,rowLabel:'红色系'},
      {name:'暖橘肤',hex:'#F7A078',rgb:[247,160,120],palette:1,row:3,rowLabel:'肤色系'},
      {name:'浅粉白皮',hex:'#F6D2C0',rgb:[246,210,192],palette:1,row:3,rowLabel:'肤色系'},
      {name:'白皙肤色',hex:'#F9E6DD',rgb:[249,230,221],palette:1,row:3,rowLabel:'肤色系'},
      {name:'奶杏肤色',hex:'#FAF0DD',rgb:[250,240,221],palette:1,row:3,rowLabel:'肤色系'},
      {name:'浅米褐',hex:'#D9CFC2',rgb:[217,207,194],palette:1,row:4,rowLabel:'浅棕大地色'},
      {name:'卡其米色',hex:'#E2D1B4',rgb:[226,209,180],palette:1,row:4,rowLabel:'浅棕大地色'},
      {name:'橘棕陶土色',hex:'#D36E28',rgb:[211,110,40],palette:1,row:4,rowLabel:'浅棕大地色'},
      {name:'焦糖棕橙',hex:'#D4893F',rgb:[212,137,63],palette:1,row:4,rowLabel:'浅棕大地色'},
      {name:'深橘橙',hex:'#F18A13',rgb:[241,138,19],palette:1,row:5,rowLabel:'暖橙黄延续'},
      {name:'亮金黄',hex:'#F8C52E',rgb:[248,197,46],palette:1,row:5,rowLabel:'暖橙黄延续'},
      {name:'浅奶黄',hex:'#F9E5B5',rgb:[249,229,181],palette:1,row:5,rowLabel:'暖橙黄延续'},
      {name:'灰橄榄褐',hex:'#BCB792',rgb:[188,183,146],palette:1,row:5,rowLabel:'暖橙黄延续'},
      {name:'橘橙色',hex:'#F28F16',rgb:[242,143,22],palette:2,row:1,rowLabel:'暖橙黄浅调'},
      {name:'鹅黄色',hex:'#F9C83A',rgb:[249,200,58],palette:2,row:1,rowLabel:'暖橙黄浅调'},
      {name:'米杏色',hex:'#F9E6B7',rgb:[249,230,183],palette:2,row:1,rowLabel:'暖橙黄浅调'},
      {name:'灰橄榄浅褐',hex:'#BCB893',rgb:[188,184,147],palette:2,row:1,rowLabel:'暖橙黄浅调'},
      {name:'浅酸柠绿',hex:'#C8DD88',rgb:[200,221,136],palette:2,row:2,rowLabel:'橄榄绿+浅棕'},
      {name:'深橄榄绿',hex:'#707216',rgb:[112,114,22],palette:2,row:2,rowLabel:'橄榄绿+浅棕'},
      {name:'土黄褐色',hex:'#B59463',rgb:[181,148,99],palette:2,row:2,rowLabel:'橄榄绿+浅棕'},
      {name:'浅摩卡棕',hex:'#B0957E',rgb:[176,149,126],palette:2,row:2,rowLabel:'橄榄绿+浅棕'},
      {name:'暗芥末黄褐',hex:'#A48C3D',rgb:[164,140,61],palette:2,row:3,rowLabel:'暗棕+深紫褐'},
      {name:'深巧克力棕',hex:'#472E1C',rgb:[71,46,28],palette:2,row:3,rowLabel:'暗棕+深紫褐'},
      {name:'红棕褐色',hex:'#86532C',rgb:[134,83,44],palette:2,row:3,rowLabel:'暗棕+深紫褐'},
      {name:'灰紫褐',hex:'#635460',rgb:[99,84,96],palette:2,row:3,rowLabel:'暗棕+深紫褐'},
      {name:'深藏青紫',hex:'#312745',rgb:[49,39,69],palette:2,row:4,rowLabel:'蓝紫色系'},
      {name:'宝蓝色',hex:'#3A499C',rgb:[58,73,156],palette:2,row:4,rowLabel:'蓝紫色系'},
      {name:'紫罗兰',hex:'#6947A8',rgb:[105,71,168],palette:2,row:4,rowLabel:'蓝紫色系'},
      {name:'淡香芋紫',hex:'#C1A8DD',rgb:[193,168,221],palette:2,row:4,rowLabel:'蓝紫色系'},
      {name:'灰薰衣草蓝',hex:'#B8B8D6',rgb:[184,184,214],palette:2,row:5,rowLabel:'浅灰蓝+湖蓝'},
      {name:'中性冷灰',hex:'#A8ABB6',rgb:[168,171,182],palette:2,row:5,rowLabel:'浅灰蓝+湖蓝'},
      {name:'松石蓝绿',hex:'#62A8B3',rgb:[98,168,179],palette:2,row:5,rowLabel:'浅灰蓝+湖蓝'},
      {name:'浅灰天蓝',hex:'#B5D1DD',rgb:[181,209,221],palette:2,row:5,rowLabel:'浅灰蓝+湖蓝'},
      {name:'薄荷浅天蓝',hex:'#94D6E8',rgb:[148,214,232],palette:2,row:6,rowLabel:'浅青+湖绿+藏青'},
      {name:'蓝绿色/水鸭绿',hex:'#42A8A0',rgb:[66,168,160],palette:2,row:6,rowLabel:'浅青+湖绿+藏青'},
      {name:'雾灰青',hex:'#B6D2CC',rgb:[182,210,204],palette:2,row:6,rowLabel:'浅青+湖绿+藏青'},
      {name:'深海藏青',hex:'#283759',rgb:[40,55,89],palette:2,row:6,rowLabel:'浅青+湖绿+藏青'}
    ];

    const GRID_SIZE = 24;
    const DISPLAY_CELL_SIZE = 22; // 可动态调整
    const DOWNLOAD_CELL_SIZE = 34;

    // DOM
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const uploadCard = document.getElementById('uploadCard');
    const cropCard = document.getElementById('cropCard');
    const cropCanvas = document.getElementById('cropCanvas');
    const cropSizeSlider = document.getElementById('cropSizeSlider');
    const sizeIndicator = document.getElementById('sizeIndicator');
    const btnConfirmCrop = document.getElementById('btnConfirmCrop');
    const btnCancelCrop = document.getElementById('btnCancelCrop');
    const resultArea = document.getElementById('resultArea');
    const pixelCanvas = document.getElementById('pixelCanvas');
    const algorithmSelect = document.getElementById('algorithmSelect');
    const downloadCanvas = document.getElementById('downloadCanvas');
    const tooltip = document.getElementById('tooltip');
    const palette1Container = document.getElementById('palette1Container');
    const palette2Container = document.getElementById('palette2Container');
    const totalBeads = document.getElementById('totalBeads');
    const btnDownload = document.getElementById('btnDownload');
    const btnToggleNumbers = document.getElementById('btnToggleNumbers');
    const btnToggleGrid = document.getElementById('btnToggleGrid');
    const btnReset = document.getElementById('btnReset');

    // 状态
    let pixelData = null, colorUsage = null;
    let showNumbers = true, showGridLines = true, hoveredCell = null, highlightColorIndex = null;
    let originalImage = null;
    let cropSourceRect = { sx:0, sy:0, sw:0, sh:0 }; // 原始坐标
    let currentAlgorithm = 'bilinear';

    // 裁剪界面变量
    let cropDisplayScale = 1, cropDisplayW = 0, cropDisplayH = 0;
    let cropBoxSize = 0, cropBoxX = 0, cropBoxY = 0;
    let isDragging = false, dragStart = {};

    // ---------- 工具函数 ----------
    function colorDistSq(rgb1, rgb2) {
      const dr = (rgb1[0]-rgb2[0])*0.299, dg = (rgb1[1]-rgb2[1])*0.587, db = (rgb1[2]-rgb2[2])*0.114;
      return dr*dr + dg*dg + db*db;
    }
    function findClosest(rgb) {
      let min = Infinity, idx = 0;
      for(let i=0; i<BEAD_PALETTE.length; i++) {
        const d = colorDistSq(rgb, BEAD_PALETTE[i].rgb);
        if(d < min) { min = d; idx = i; }
      }
      return idx;
    }
    function getLuminance(rgb) { return 0.299*rgb[0]+0.587*rgb[1]+0.114*rgb[2]; }

    // ---------- 四种缩放算法 ----------
    function applyAlgorithm(img, sx, sy, sw, sh, algo) {
      const outCanvas = document.createElement('canvas');
      outCanvas.width = GRID_SIZE;
      outCanvas.height = GRID_SIZE;
      const ctx = outCanvas.getContext('2d');

      if (algo === 'nearest') {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, GRID_SIZE, GRID_SIZE);
      } else if (algo === 'bilinear') {
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, GRID_SIZE, GRID_SIZE);
      } else if (algo === 'average') {
        // 平均池化
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = sw;
        tempCanvas.height = sh;
        const tctx = tempCanvas.getContext('2d');
        tctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
        const srcData = tctx.getImageData(0, 0, sw, sh).data;
        const outData = ctx.createImageData(GRID_SIZE, GRID_SIZE);
        for (let row = 0; row < GRID_SIZE; row++) {
          const yStart = Math.floor(row * sh / GRID_SIZE);
          const yEnd = Math.floor((row + 1) * sh / GRID_SIZE);
          for (let col = 0; col < GRID_SIZE; col++) {
            const xStart = Math.floor(col * sw / GRID_SIZE);
            const xEnd = Math.floor((col + 1) * sw / GRID_SIZE);
            let r = 0, g = 0, b = 0, cnt = 0;
            for (let y = yStart; y < yEnd; y++) {
              for (let x = xStart; x < xEnd; x++) {
                const i = (y * sw + x) * 4;
                r += srcData[i]; g += srcData[i+1]; b += srcData[i+2];
                cnt++;
              }
            }
            const idx = (row * GRID_SIZE + col) * 4;
            outData.data[idx] = Math.round(r/cnt);
            outData.data[idx+1] = Math.round(g/cnt);
            outData.data[idx+2] = Math.round(b/cnt);
            outData.data[idx+3] = 255;
          }
        }
        ctx.putImageData(outData, 0, 0);
      } else if (algo === 'gaussian') {
        // 先绘制到临时画布，应用模糊后再缩小
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = sw;
        tempCanvas.height = sh;
        const tctx = tempCanvas.getContext('2d');
        tctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
        if ('filter' in ctx) {
          ctx.filter = 'blur(1.2px)';
          ctx.drawImage(tempCanvas, 0, 0, sw, sh, 0, 0, GRID_SIZE, GRID_SIZE);
          ctx.filter = 'none';
        } else {
          // 回退
          ctx.imageSmoothingEnabled = true;
          ctx.drawImage(tempCanvas, 0, 0, sw, sh, 0, 0, GRID_SIZE, GRID_SIZE);
        }
      }
      return outCanvas.getContext('2d').getImageData(0, 0, GRID_SIZE, GRID_SIZE);
    }

    // ---------- 像素数据处理 ----------
    function rebuildPixelData() {
      if (!originalImage || !cropSourceRect.sw) return;
      const { sx, sy, sw, sh } = cropSourceRect;
      const imageData = applyAlgorithm(originalImage, sx, sy, sw, sh, currentAlgorithm);
      const px = imageData.data;
      pixelData = new Uint8Array(GRID_SIZE * GRID_SIZE);
      colorUsage = new Map();
      for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
        const r = px[i*4], g = px[i*4+1], b = px[i*4+2];
        const bead = findClosest([r,g,b]);
        pixelData[i] = bead;
        colorUsage.set(bead, (colorUsage.get(bead)||0)+1);
      }
      renderDisplayCanvas();
      renderPaletteLegend();
      updateTotalBeads();
    }

    // ---------- 显示渲染 ----------
    function updateDisplayCellSize() {
      const max = Math.min(window.innerWidth-50, 540);
      const size = Math.floor(max / GRID_SIZE);
      return Math.max(13, Math.min(size, 24));
    }
    function renderDisplayCanvas() {
      if (!pixelData) return;
      const cell = updateDisplayCellSize();
      const total = cell * GRID_SIZE;
      const dpr = window.devicePixelRatio || 1;
      pixelCanvas.width = total * dpr;
      pixelCanvas.height = total * dpr;
      pixelCanvas.style.width = total + 'px';
      pixelCanvas.style.height = total + 'px';
      const ctx = pixelCanvas.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.clearRect(0,0,total,total);
      for (let r=0; r<GRID_SIZE; r++) {
        for (let c=0; c<GRID_SIZE; c++) {
          const idx = r*GRID_SIZE+c;
          const bead = pixelData[idx];
          const color = BEAD_PALETTE[bead].hex;
          const x = c*cell, y = r*cell;
          let alpha = (highlightColorIndex !== null && highlightColorIndex !== bead) ? 0.4 : 1;
          ctx.globalAlpha = alpha;
          ctx.fillStyle = color;
          ctx.fillRect(x, y, cell, cell);
          ctx.globalAlpha = 1;
          if (showGridLines) {
            ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 0.4;
            ctx.strokeRect(x+0.2, y+0.2, cell-0.4, cell-0.4);
          }
          if (showNumbers && cell>=14 && alpha>0.5) {
            const lum = getLuminance(BEAD_PALETTE[bead].rgb);
            ctx.fillStyle = lum>135 ? 'rgba(0,0,0,0.7)' : 'rgba(255,255,255,0.85)';
            ctx.font = `bold ${Math.max(7,cell*0.4)}px "SF Mono", monospace`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(String(bead+1), x+cell/2, y+cell/2);
          }
          if (hoveredCell && hoveredCell.row===r && hoveredCell.col===c) {
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            ctx.fillRect(x,y,cell,cell);
            ctx.strokeStyle = '#333'; ctx.lineWidth=2;
            ctx.strokeRect(x+1,y+1,cell-2,cell-2);
          }
        }
      }
    }

    function renderPaletteLegend() {
      if (!colorUsage) return;
      [1,2].forEach(pNum => {
        const container = pNum===1 ? palette1Container : palette2Container;
        const colors = BEAD_PALETTE.filter(c=>c.palette===pNum);
        const rows = {};
        colors.forEach(c => { if(!rows[c.row]) rows[c.row]=[]; rows[c.row].push(c); });
        let html = '<table class="palette-table"><thead><tr><th>分类</th>';
        for(let i=0;i<4;i++) html+=`<th>色${i+1}</th>`;
        html+='</tr></thead><tbody>';
        Object.keys(rows).sort((a,b)=>a-b).forEach(rk => {
          const rowColors = rows[rk];
          html += '<tr><td class="row-label">'+rowColors[0].rowLabel+'</td>';
          for(let i=0;i<4;i++) {
            if(i<rowColors.length) {
              const c = rowColors[i];
              const idx = BEAD_PALETTE.indexOf(c);
              const cnt = colorUsage.get(idx)||0;
              html += `<td class="color-cell${cnt===0?' dimmed':''}" data-bead="${idx}">
                <span class="swatch" style="background:${c.hex}"></span>
                <span class="color-num">#${idx+1}</span>
                <span class="color-count-badge${cnt===0?' zero':''}">${cnt}</span>
              </td>`;
            } else html += '<td></td>';
          }
          html += '</tr>';
        });
        html += '</tbody></table>';
        container.innerHTML = html;
      });
      // 绑定事件
      document.querySelectorAll('.color-cell[data-bead]').forEach(cell => {
        const bead = parseInt(cell.dataset.bead);
        cell.addEventListener('mouseenter', () => {
          highlightColorIndex = bead;
          document.querySelectorAll('.color-cell').forEach(c=>c.classList.remove('highlight-cell'));
          document.querySelectorAll(`.color-cell[data-bead="${bead}"]`).forEach(c=>c.classList.add('highlight-cell'));
          renderDisplayCanvas();
        });
        cell.addEventListener('mouseleave', () => {
          highlightColorIndex = null;
          document.querySelectorAll('.color-cell').forEach(c=>c.classList.remove('highlight-cell'));
          renderDisplayCanvas();
        });
        cell.addEventListener('click', () => {
          highlightColorIndex = (highlightColorIndex===bead) ? null : bead;
          document.querySelectorAll('.color-cell').forEach(c=>c.classList.remove('highlight-cell'));
          if (highlightColorIndex !== null) document.querySelectorAll(`.color-cell[data-bead="${bead}"]`).forEach(c=>c.classList.add('highlight-cell'));
          renderDisplayCanvas();
        });
      });
    }

    function updateTotalBeads() {
      if (!colorUsage) return;
      let total = 0; colorUsage.forEach(v=>total+=v);
      totalBeads.innerHTML = `📦 总计 <span style="color:#d4893f;font-weight:700;">${total}</span> 颗 (${colorUsage.size}色)`;
    }

    // ---------- 裁剪逻辑 ----------
    function openCrop(img) {
      originalImage = img;
      const w = img.naturalWidth, h = img.naturalHeight;
      const short = Math.min(w,h);
      cropDisplayScale = short <= 560 ? 1 : 560/short;
      cropDisplayW = Math.round(w * cropDisplayScale);
      cropDisplayH = Math.round(h * cropDisplayScale);
      cropBoxSize = Math.round(Math.min(cropDisplayW, cropDisplayH) * 0.85);
      cropBoxX = Math.round((cropDisplayW - cropBoxSize)/2);
      cropBoxY = Math.round((cropDisplayH - cropBoxSize)/2);
      cropCanvas.width = cropDisplayW;
      cropCanvas.height = cropDisplayH;
      cropCanvas.style.width = cropDisplayW+'px';
      cropCanvas.style.height = cropDisplayH+'px';
      uploadCard.style.display = 'none';
      resultArea.classList.remove('active');
      cropCard.classList.add('active');
      cropSizeSlider.value = 85;
      sizeIndicator.textContent = '85%';
      renderCropCanvas();
      cropCard.scrollIntoView({behavior:'smooth'});
    }
    function renderCropCanvas() {
      if (!originalImage) return;
      const ctx = cropCanvas.getContext('2d');
      ctx.clearRect(0,0,cropDisplayW,cropDisplayH);
      ctx.drawImage(originalImage,0,0,cropDisplayW,cropDisplayH);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0,0,cropDisplayW,cropBoxY);
      ctx.fillRect(0,cropBoxY+cropBoxSize,cropDisplayW,cropDisplayH-cropBoxY-cropBoxSize);
      ctx.fillRect(0,cropBoxY,cropBoxX,cropBoxSize);
      ctx.fillRect(cropBoxX+cropBoxSize,cropBoxY,cropDisplayW-cropBoxX-cropBoxSize,cropBoxSize);
      ctx.strokeStyle='white'; ctx.lineWidth=3; ctx.strokeRect(cropBoxX,cropBoxY,cropBoxSize,cropBoxSize);
      ctx.strokeStyle='#d4893f'; ctx.lineWidth=5; ctx.strokeRect(cropBoxX-1,cropBoxY-1,cropBoxSize+2,cropBoxSize+2);
    }
    function getCropPos(e) {
      const rect = cropCanvas.getBoundingClientRect();
      const scaleX = cropDisplayW/rect.width, scaleY = cropDisplayH/rect.height;
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: (cx-rect.left)*scaleX, y: (cy-rect.top)*scaleY };
    }
    cropCanvas.addEventListener('mousedown', e => {
      const p = getCropPos(e);
      if (p.x>=cropBoxX && p.x<=cropBoxX+cropBoxSize && p.y>=cropBoxY && p.y<=cropBoxY+cropBoxSize) {
        isDragging = true;
        dragStart = { mx:p.x, my:p.y, bx:cropBoxX, by:cropBoxY };
      }
    });
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const p = getCropPos(e);
      cropBoxX = Math.min(Math.max(dragStart.bx + p.x - dragStart.mx, 0), cropDisplayW-cropBoxSize);
      cropBoxY = Math.min(Math.max(dragStart.by + p.y - dragStart.my, 0), cropDisplayH-cropBoxSize);
      renderCropCanvas();
    });
    window.addEventListener('mouseup', ()=> isDragging=false);
    cropSizeSlider.addEventListener('input', ()=>{
      const pct = parseInt(cropSizeSlider.value);
      sizeIndicator.textContent = pct+'%';
      const newSize = Math.round(Math.min(cropDisplayW,cropDisplayH)*pct/100);
      cropBoxX = Math.min(Math.max(cropBoxX + (cropBoxSize-newSize)/2, 0), cropDisplayW-newSize);
      cropBoxY = Math.min(Math.max(cropBoxY + (cropBoxSize-newSize)/2, 0), cropDisplayH-newSize);
      cropBoxSize = newSize;
      renderCropCanvas();
    });

    btnConfirmCrop.addEventListener('click', ()=>{
      cropSourceRect = {
        sx: Math.round(cropBoxX / cropDisplayScale),
        sy: Math.round(cropBoxY / cropDisplayScale),
        sw: Math.round(cropBoxSize / cropDisplayScale),
        sh: Math.round(cropBoxSize / cropDisplayScale)
      };
      cropCard.classList.remove('active');
      resultArea.classList.add('active');
      rebuildPixelData();
      resultArea.scrollIntoView({behavior:'smooth'});
    });
    btnCancelCrop.addEventListener('click', ()=>{
      cropCard.classList.remove('active');
      uploadCard.style.display = '';
      originalImage = null;
    });

    // ---------- 文件处理 ----------
    function handleFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => openCrop(img);
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
    uploadZone.addEventListener('click', ()=> fileInput.click());
    fileInput.addEventListener('change', (e)=> { if(e.target.files[0]) handleFile(e.target.files[0]); });
    uploadZone.addEventListener('dragover', e=>{ e.preventDefault(); uploadZone.classList.add('drag-over'); });
    uploadZone.addEventListener('dragleave', ()=> uploadZone.classList.remove('drag-over'));
    uploadZone.addEventListener('drop', e=>{
      e.preventDefault(); uploadZone.classList.remove('drag-over');
      if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
    document.addEventListener('paste', e=>{
      if (cropCard.classList.contains('active') || resultArea.classList.contains('active')) return;
      const items = e.clipboardData?.items;
      if (items) for (let item of items) if (item.type.startsWith('image/')) { handleFile(item.getAsFile()); break; }
    });

    // ---------- 算法切换 ----------
    algorithmSelect.addEventListener('change', ()=>{
      currentAlgorithm = algorithmSelect.value;
      if (pixelData) rebuildPixelData();
    });

    // ---------- 结果界面按钮 ----------
    pixelCanvas.addEventListener('mousemove', e=>{
      const rect = pixelCanvas.getBoundingClientRect();
      const scaleX = (DISPLAY_CELL_SIZE*GRID_SIZE)/rect.width;
      const scaleY = (DISPLAY_CELL_SIZE*GRID_SIZE)/rect.height;
      const col = Math.floor((e.clientX-rect.left)*scaleX/DISPLAY_CELL_SIZE);
      const row = Math.floor((e.clientY-rect.top)*scaleY/DISPLAY_CELL_SIZE);
      if (row>=0&&row<GRID_SIZE&&col>=0&&col<GRID_SIZE) {
        hoveredCell = {row,col};
        const bead = pixelData[row*GRID_SIZE+col];
        tooltip.textContent = `#${bead+1} ${BEAD_PALETTE[bead].name} | ${BEAD_PALETTE[bead].hex}`;
        tooltip.style.left = e.clientX+15+'px';
        tooltip.style.top = e.clientY-35+'px';
        tooltip.classList.add('visible');
        renderDisplayCanvas();
      } else { hoveredCell=null; tooltip.classList.remove('visible'); renderDisplayCanvas(); }
    });
    pixelCanvas.addEventListener('mouseleave', ()=>{ hoveredCell=null; tooltip.classList.remove('visible'); renderDisplayCanvas(); });
    btnToggleNumbers.addEventListener('click', ()=>{ showNumbers=!showNumbers; renderDisplayCanvas(); });
    btnToggleGrid.addEventListener('click', ()=>{ showGridLines=!showGridLines; renderDisplayCanvas(); });
    btnReset.addEventListener('click', ()=>{
      pixelData=null; colorUsage=null; originalImage=null;
      resultArea.classList.remove('active'); cropCard.classList.remove('active');
      uploadCard.style.display=''; palette1Container.innerHTML=''; palette2Container.innerHTML='';
    });
    btnDownload.addEventListener('click', ()=>{
      if (!pixelData) return;
      const cell = DOWNLOAD_CELL_SIZE, total = cell*GRID_SIZE;
      downloadCanvas.width = total*2; downloadCanvas.height = total*2;
      const ctx = downloadCanvas.getContext('2d'); ctx.scale(2,2);
      ctx.fillStyle='white'; ctx.fillRect(0,0,total,total);
      for (let r=0;r<GRID_SIZE;r++) for (let c=0;c<GRID_SIZE;c++) {
        const bead = pixelData[r*GRID_SIZE+c];
        ctx.fillStyle = BEAD_PALETTE[bead].hex;
        ctx.fillRect(c*cell, r*cell, cell, cell);
        ctx.fillStyle = getLuminance(BEAD_PALETTE[bead].rgb)>135?'#333':'white';
        ctx.font = 'bold 10px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(bead+1, c*cell+cell/2, r*cell+cell/2);
      }
      const a = document.createElement('a');
      a.download = '拼豆图纸_24x24.png';
      a.href = downloadCanvas.toDataURL();
      a.click();
    });

    // 初始演示
    (function loadDemo(){
      const c = document.createElement('canvas'); c.width=240;c.height=240;
      const ctx=c.getContext('2d');
      const g=ctx.createRadialGradient(100,90,20,120,120,150);
      g.addColorStop(0,'#F8C52E'); g.addColorStop(0.3,'#F18A13'); g.addColorStop(0.6,'#D13A3A');
      g.addColorStop(0.8,'#6947A8'); g.addColorStop(1,'#3A499C');
      ctx.fillStyle=g; ctx.fillRect(0,0,240,240);
      const img=new Image(); img.onload=()=>{
        originalImage=img;
        cropSourceRect={sx:0,sy:0,sw:240,sh:240};
        resultArea.classList.add('active'); uploadCard.style.display='none';
        rebuildPixelData();
      };
      img.src=c.toDataURL();
    })();
  })();
</script>
</body>
